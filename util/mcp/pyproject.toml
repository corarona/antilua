[project]
name = "antilua-mcp"
version = "0.1.0"
description = "MCP server for driving a running Antilua client via its Lua pipe"
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
]

[project.scripts]
antilua-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]